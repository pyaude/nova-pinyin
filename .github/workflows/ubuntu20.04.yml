name: Validate Ubuntu 20.04 package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  focal:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
    steps:
      - name: Install native build and graphical test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-10 g++-10 cmake ninja-build pkg-config extra-cmake-modules gettext appstream ca-certificates curl git python3-pip libdbus-1-dev libsystemd-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-util-dev libxcb-xkb-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-icccm4-dev libxcb-ewmh-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxkbfile-dev libfmt-dev libjson-c-dev libzstd-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libboost-iostreams-dev libboost-filesystem-dev libsqlite3-dev libopencc-dev libgtest-dev dpkg-dev python3-tk libgtk-3-dev qtbase5-dev qtbase5-private-dev libqt5x11extras5-dev libkf5itemviews-dev libkf5widgetsaddons-dev xvfb xauth xdotool dbus-x11 fcitx5-frontend-gtk3 fcitx5-frontend-qt5 im-config fonts-noto-cjk
          python3 -m pip install cmake==3.28.3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and package with Focal compiler and libraries
        run: ./scripts/build-focal-deb.sh
      - name: Address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-asan-focal -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-10 -DCMAKE_CXX_COMPILER=g++-10 -DCMAKE_PREFIX_PATH=/usr/lib/novapinyin/focal -DNOVA_MODEL_FILE=/usr/lib/novapinyin/focal/lib/libime/zh_CN.lm -DNOVA_DICTIONARY_DIR=/usr/lib/novapinyin/focal/share/libime -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          cmake --build build-asan-focal --parallel 2
          ctest --test-dir build-asan-focal --output-on-failure
      - name: Install and verify user login, recovery and graphical input
        run: |
          apt-get install -y --no-install-recommends ./dist/ubuntu20.04/*.deb
          cmake -S . -B build-focal/nova -DNOVA_GUI_SMOKE=ON
          cmake --build build-focal/nova --parallel 2
          NOVA_ISOLATED_GUI_TEST=1 python3 tests/focal-session-setup-test.py
          NOVA_ISOLATED_GUI_TEST=1 xvfb-run -a python3 tests/focal-imconfig-test.py
          NOVA_ISOLATED_GUI_TEST=1 xvfb-run -a python3 tests/focal-package-smoke.py
          NOVA_ISOLATED_GUI_TEST=1 XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" xvfb-run -a python3 tests/manager-smoke.py
          NOVA_ISOLATED_GUI_TEST=1 NOVA_BUILD_DIR=build-focal/nova NOVA_GUI_FCITX_BIN=novapinyin-fcitx5 NOVA_GUI_REMOTE_BIN=/usr/lib/novapinyin/focal/bin/fcitx5-remote NOVA_GUI_IM_MODULE=fcitx5 xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/candidate-ui-smoke.py
          PATH=/usr/lib/novapinyin/focal/bin:$PATH NOVA_ISOLATED_GUI_TEST=1 NOVA_BUILD_DIR=build-focal/nova NOVA_GUI_FCITX_BIN=novapinyin-fcitx5 NOVA_GUI_IM_MODULE=fcitx5 dbus-run-session -- bash tests/gui-smoke.sh
      - name: Verify package and matching source checksums
        working-directory: dist/ubuntu20.04
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check SOURCE_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu20.04-package
          path: |
            dist/ubuntu20.04/*.deb
            dist/ubuntu20.04/*_sources.tar.gz
          if-no-files-found: error

name: Publish Ubuntu pre-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(sed -n 's/^Version: //p' packaging/control.in | cut -d- -f1)
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Install build and graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libfcitx5core-dev libfcitx5config-dev libimecore-dev libimepinyin-dev libime-data libboost-dev libsqlite3-dev libopencc-dev libgtest-dev dpkg-dev python3-tk git libgtk-3-dev qtbase5-dev xvfb xauth xdotool dbus-x11
      - name: Build, test and package
        run: ./scripts/build-deb.sh
      - name: Install and verify graphical input
        run: |
          version=$(sed -n 's/^Version: //p' packaging/control.in)
          sudo apt-get install -y "./dist/novapinyin_${version}_amd64.deb"
          cmake -S . -B build -DNOVA_GUI_SMOKE=ON
          cmake --build build --parallel 2
          NOVA_ISOLATED_GUI_TEST=1 dbus-run-session -- bash tests/gui-smoke.sh
          NOVA_ISOLATED_GUI_TEST=1 XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" xvfb-run -a python3 tests/manager-smoke.py
      - name: Create portable checksum file
        working-directory: dist
        run: |
          version=$(sed -n 's/^Version: //p' ../packaging/control.in)
          sha256sum "novapinyin_${version}_amd64.deb" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pre-release-package
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pre-release-package
          path: dist
      - name: Verify assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "NovaPinyin $GITHUB_REF_NAME（预发布）" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"

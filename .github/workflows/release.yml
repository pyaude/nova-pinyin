name: Publish Ubuntu release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focal:
    uses: ./.github/workflows/ubuntu20.04.yml
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(sed -n 's/^Version: //p' packaging/control.in | cut -d- -f1)
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Install build and graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libfcitx5core-dev libfcitx5config-dev libimecore-dev libimepinyin-dev libime-data libboost-dev libsqlite3-dev libopencc-dev libgtest-dev dpkg-dev python3-tk git libgtk-3-dev qtbase5-dev xvfb xauth xdotool dbus-x11 fonts-noto-cjk
      - name: Build, test and package
        run: ./scripts/build-deb.sh
      - name: Address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - name: Install and verify graphical input
        run: |
          version="$(sed -n 's/^Version: //p' packaging/control.in)~ubuntu24.04.1"
          sudo apt-get install -y "./dist/novapinyin_${version}_amd64.deb"
          cmake -S . -B build -DNOVA_GUI_SMOKE=ON
          cmake --build build --parallel 2
          NOVA_ISOLATED_GUI_TEST=1 dbus-run-session -- bash tests/gui-smoke.sh
          NOVA_ISOLATED_GUI_TEST=1 XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" xvfb-run -a python3 tests/manager-smoke.py
          NOVA_ISOLATED_GUI_TEST=1 xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/candidate-ui-smoke.py
      - name: Create portable checksum file
        working-directory: dist
        run: |
          version="$(sed -n 's/^Version: //p' ../packaging/control.in)~ubuntu24.04.1"
          sha256sum "novapinyin_${version}_amd64.deb" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu24.04-package
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [build, focal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ubuntu*-package
          merge-multiple: true
          path: dist
      - name: Verify assets
        working-directory: dist
        run: |
          version=$(sed -n 's/^Version: //p' ../packaging/control.in)
          test -f "novapinyin_${version}~ubuntu20.04.1_amd64.deb"
          test -f "novapinyin_${version}~ubuntu24.04.1_amd64.deb"
          test -f "novapinyin_${version}~ubuntu20.04.1_sources.tar.gz"
          # GitHub replaces ~ during upload. Normalize before hashing/uploading.
          for asset in *.deb *_sources.tar.gz; do
            safe_name=$(printf '%s' "$asset" | tr '~' '.')
            if [ "$asset" != "$safe_name" ]; then mv "$asset" "$safe_name"; fi
          done
          sha256sum *.deb *_sources.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*_sources.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "NovaPinyin $GITHUB_REF_NAME（正式版）" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"

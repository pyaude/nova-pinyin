name: Build and test Ubuntu packages
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focal:
    uses: ./.github/workflows/ubuntu20.04.yml
  ubuntu:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libfcitx5core-dev libfcitx5config-dev libimecore-dev libimepinyin-dev libime-data libboost-dev libsqlite3-dev libopencc-dev libgtest-dev dpkg-dev python3-tk git
      - name: Build, test and package
        run: ./scripts/build-deb.sh
      - name: Address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: novapinyin-${{ matrix.os }}-amd64
          path: dist/*
